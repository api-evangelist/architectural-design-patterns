naftiko: 1.0.0-alpha2
info:
  label: Architectural Design Patterns API — Categories
  description: 'Architectural Design Patterns API — Categories. 1 operations. Lead operation: List pattern categories. Self-contained
    Naftiko capability covering one Architectural Design Patterns business surface.'
  tags:
  - Architectural Design Patterns
  - Categories
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ARCHITECTURAL_DESIGN_PATTERNS_API_KEY: ARCHITECTURAL_DESIGN_PATTERNS_API_KEY
capability:
  consumes:
  - type: http
    namespace: architectural-design-patterns-categories
    baseUri: https://api.apievangelist.com/v1/architectural-design-patterns
    description: Architectural Design Patterns API — Categories business capability. Self-contained, no shared references.
    resources:
    - name: categories
      path: /categories
      operations:
      - name: listcategories
        method: GET
        description: List pattern categories
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: architectural-design-patterns-categories-rest
    port: 8080
    description: REST adapter for Architectural Design Patterns API — Categories. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/categories
      name: categories
      description: REST surface for categories.
      operations:
      - method: GET
        name: listcategories
        description: List pattern categories
        call: architectural-design-patterns-categories.listcategories
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: architectural-design-patterns-categories-mcp
    port: 9090
    transport: http
    description: MCP adapter for Architectural Design Patterns API — Categories. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: list-pattern-categories
      description: List pattern categories
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: architectural-design-patterns-categories.listcategories
      outputParameters:
      - type: object
        mapping: $.
